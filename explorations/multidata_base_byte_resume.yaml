# explorations/multokenization.yaml
---
# Base hyperparameters
named_static_groups:
  - named_group: "1-1-1_1-1-1"
    dataset_sampling_probs: 
      - [1, 1, 1]
    dataset_sampling_probs_final: 
      - [1, 1, 1]

  - named_group: "linear"
    dataset_sampling_probs_transition_method: [linear]

  - named_group: "byte_jckj"
    dataset: [byte_ted_ja]
    dataset_list: [byte_ted_ja byte_ted_ko byte_ted_zh]
    batch_size: [16]
    max_iters: [61500]

  - named_group: "byte_kckj"
    dataset: [byte_ted_ko]
    dataset_list: [byte_ted_ja byte_ted_ko byte_ted_zh]
    batch_size: [16]
    max_iters: [34500]

  - named_group: "byte_cckj"
    dataset: [byte_ted_zh]
    dataset_list: [byte_ted_ja byte_ted_ko byte_ted_zh]
    batch_size: [16]
    max_iters: [42900]

  - named_group: "ipa_jckj"
    dataset: [ipa_ted_ja]
    dataset_list: [ipa_ted_ja ipa_ted_ko ipa_ted_zh]
    batch_size: [16]
    max_iters: [75600]

  - named_group: "tiktoken_jckj"
    dataset: [tik_ted_ja]
    dataset_list: [tik_ted_ja tik_ted_ko tik_ted_zh]

  - named_group: "ipa_cckj"
    dataset: [ipa_ted_zh]
    dataset_list: [ipa_ted_ja ipa_ted_ko ipa_ted_zh]
    batch_size: [16]
    max_iters: [77100]

  - named_group: "tiktoken_cckj"
    dataset: [tik_ted_zh]
    dataset_list: [tik_ted_ja tik_ted_ko tik_ted_zh]

  - named_group: "ipa_kckj"
    dataset: [ipa_ted_ko]
    dataset_list: [ipa_ted_ja ipa_ted_ko ipa_ted_zh]
    batch_size: [16]
    max_iters: [39000]

  - named_group: "tiktoken_kckj"
    dataset: [tik_ted_ko]
    dataset_list: [tik_ted_ja tik_ted_ko tik_ted_zh]

  - named_group: "base_batch_iters"
    batch_size: [16]
    max_iters: [30000]

  - named_group: "one_hot_layer0"
    use_lsv: [true]
    lsv_variant: [one_hot]
    apply_lsv_at_layer_idx: [0]

  - named_group: "one_hot_layer6"
    use_lsv: [true]
    lsv_variant: [one_hot]
    apply_lsv_at_layer_idx: [6]

  - named_group: "ohmg_layer0"
    use_lsv: [true]
    lsv_variant: [ohmg]
    apply_lsv_at_layer_idx: [0]

  - named_group: "ohmg_layer6"
    use_lsv: [true]
    lsv_variant: [ohmg]
    apply_lsv_at_layer_idx: [6]

  - named_group: "without_lsv"
    use_lsv: [false]

training_mode: [multidataset]
init_from: [resume]
init_from_ckpt: [ckpt.pt]
dataset_interleaving: [true]
learning_rate: [6e-4]
n_layer: [12]
n_head: [12]
n_embd: [768]
block_size: [1024]
use_rotary_embeddings: [true]
use_abs_pos_embeddings: [false]
use_qk_norm: [true]
use_qk_norm_scale: [true]
use_peri_ln: [true]
use_gradient_checkpoint: [true]
max_sample_tokens: [100]
eval_interval: [1000]
sample_each_eval: [true]
compile: [true]
seed: [1, 2, 3, 4, 5]

parameter_groups:
