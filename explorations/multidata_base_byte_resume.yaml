  - named_group_static: ["byte_cckj", "1-1-1_1-1-1", "linear"]
    named_group_alternates: ["one_hot_layer0", "ohmg_layer0", "without_lsv"]

  - named_group_static: ["byte_kckj", "1-1-1_1-1-1", "linear"]
    named_group_alternates: ["one_hot_layer0", "ohmg_layer0", "without_lsv"]

